# SmartTravel application stack: API Gateway, six services, RabbitMQ and their init jobs.
# Databases are configuration, not containers here: every service reads its database from .env.
#
#   Default (Neon + Atlas): python backend/platform/init_env.py (then fill .env)
#     docker compose up -d --build --wait
#     or: python backend/platform/cloud/manage.py up (validates and preflights first)
#   Isolated local tests only: python backend/platform/init_env.py --mode local
#     docker compose --env-file .env.local -f docker-compose.yml -f docker-compose.local.yml up -d --build --wait
#
# Only the Gateway publishes a port (GATEWAY_PUBLISH, loopback by default).
# Services run the p02-local profile: service-to-service HTTP stays on the private Docker network.
name: smarttravel-cloud

x-service-build: &service-build
  # source = compile inside Docker; runtime = package a JAR already verified in target/ (CI).
  target: ${SERVICE_BUILD_TARGET:-source}
  additional_contexts:
    backend: ./backend

# Shared by the six Spring services; each service adds its own identity and credentials.
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: p02-local
  JWT_ISSUER: http://identity:8101
  JWT_JWKS_URI: http://identity:8101/.well-known/jwks.json
  BROKER_HOST: rabbitmq
  BROKER_PORT: '5672'
  BROKER_VHOST: smarttravel
  IDENTITY_SESSION_URI: http://identity:8101/internal/v1/security/session
  # Downstream services reuse a positive session answer briefly (F-33); the Gateway checks every request.
  IDENTITY_SESSION_CACHE_SECONDS: ${IDENTITY_SESSION_CACHE_SECONDS:-15}
  GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?run backend/platform/init_env.py}
  CATALOG_BASE_URL: http://catalog:8102
  CATALOG_URL: http://catalog:8102
  INGESTION_URL: http://ingestion:8105
  IDENTITY_URL: http://identity:8101
  COMMUNITY_URL: http://community:8103
  TRIP_URL: http://trip:8104
  TRANSPORT_ENABLED: 'true'
  WORKLOAD_TOKEN_URI: http://identity:8101/internal/v1/security/workload-token
  SPRING_APPLICATION_JSON: >-
    {"catalog.base-url":"http://catalog:8102","ingestion.base-url":"http://ingestion:8105",
    "intelligence.community-url":"http://community:8103","intelligence.identity-url":"http://identity:8101",
    "intelligence.trip-url":"http://trip:8104","catalog.cursor-key":"${CATALOG_CURSOR_KEY:?run backend/platform/init_env.py}"}

x-service: &service
  restart: unless-stopped
  depends_on: &service-depends
    rabbit-init: {condition: service_completed_successfully}
  healthcheck: &ready
    test: [CMD-SHELL, 'curl -fsS "http://127.0.0.1:$$PORT/actuator/health/readiness" >/dev/null']
    interval: 5s
    timeout: 3s
    retries: 60
    # Managed databases (Neon) may need time to wake up on the first connection.
    start_period: 60s

services:
  # ---- Messaging (private network; the local override adds loopback debug ports) -----------
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # Fixed node name so queues and messages survive container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
      RABBITMQ_CTL_ERL_ARGS: +S 2:2
      RABBITMQ_DEFAULT_USER: platform_admin
      RABBITMQ_DEFAULT_PASS: ${BROKER_ADMIN_PASSWORD:?run backend/platform/init_env.py}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD-SHELL, su-exec rabbitmq rabbitmq-diagnostics -q check_running && su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # ---- One-shot init jobs (idempotent; safe on every `up`) ---------------------------------
  # Identity RS256 signing key in a private volume; an existing key set is kept, never replaced.
  key-init:
    build: {context: ./backend/platform/init}
    image: smarttravel-platform-tools:local
    user: '0:0'
    command: [python, identity_keys.py]
    network_mode: none
    volumes: [identity-signing-keys:/keys]

  # Vhost, per-service users/permissions, exchanges and bindings from contracts/registry.json.
  rabbit-init:
    build: {context: ./backend/platform/init}
    image: smarttravel-platform-tools:local
    depends_on:
      key-init: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
    environment:
      BROKER_API_URL: http://rabbitmq:15672
      BROKER_ADMIN_PASSWORD: ${BROKER_ADMIN_PASSWORD:?run backend/platform/init_env.py}
      IDENTITY_BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      CATALOG_BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run backend/platform/init_env.py}
      COMMUNITY_BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      TRIP_BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INGESTION_BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INTELLIGENCE_BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run backend/platform/init_env.py}
      CATALOG_BROKER_OPERATOR_PASSWORD: ${CATALOG_BROKER_OPERATOR_PASSWORD:?run backend/platform/init_env.py}
    volumes: [./backend/contracts/registry.json:/contracts/registry.json:ro]

  # Community schema revisions (collections, validators, indexes, checksums). The migrator
  # authenticates through the URI; users and the replica set belong to the database platform.
  community-migrate:
    image: mongo:8.0
    environment:
      COMMUNITY_MONGODB_MIGRATION_URI: ${COMMUNITY_MONGODB_MIGRATION_URI:?set COMMUNITY_MONGODB_MIGRATION_URI in .env}
      COMMUNITY_MIGRATION_URI_AUTH: 'true'
    entrypoint: [bash, -ec]
    command: ['mongosh "$$COMMUNITY_MONGODB_MIGRATION_URI" --quiet /p01/migrate.js']
    volumes:
      - ./backend/infra/mongo/migrate.js:/p01/migrate.js:ro
      - ./backend/services/community-service/src/main/resources/db/migration:/migrations:ro

  # ---- Application services (no published ports; reachable through the Gateway) -----------
  identity:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/identity-service}
    image: smarttravel-identity:p02-local
    depends_on:
      <<: *service-depends
      key-init: {condition: service_completed_successfully}
    environment:
      <<: *service-env
      PORT: '8101'
      JWT_AUDIENCE: identity
      BROKER_USERNAME: identity_runtime
      BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      # Catalog and Community read the service-scoped name for spring.rabbitmq.password.
      IDENTITY_BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      IDENTITY_TRANSPORT_ENABLED: 'true'
      DB_URL: ${IDENTITY_DB_URL:?set IDENTITY_DB_URL in .env}
      DB_USER: identity_runtime
      DB_PASSWORD: ${IDENTITY_RUNTIME_PASSWORD:?set IDENTITY_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: identity_migrator
      DB_MIGRATION_PASSWORD: ${IDENTITY_MIGRATION_PASSWORD:?set IDENTITY_MIGRATION_PASSWORD in .env}
      IDENTITY_KEYS_FILE: /run/identity/keys.json
      IDENTITY_ACTIVE_KID: p02-identity-1
      IDENTITY_MAIL_KEY: ${IDENTITY_MAIL_KEY:?run backend/platform/init_env.py}
      # External SMTP; notification e-mail stays off until configured (local override: Mailpit).
      IDENTITY_NOTIFICATION_EMAIL_ENABLED: ${IDENTITY_NOTIFICATION_EMAIL_ENABLED:-false}
      IDENTITY_MAIL_FROM: ${IDENTITY_MAIL_FROM:-no-reply@smarttravel.invalid}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_TLS_REQUIRED: ${MAIL_TLS_REQUIRED:-true}
      # Synthetic demo accounts fixture-*@example.invalid (password IDENTITY_FIXTURE_PASSWORD).
      IDENTITY_FIXTURES_ENABLED: ${IDENTITY_FIXTURES_ENABLED:-false}
      IDENTITY_FIXTURE_PASSWORD: ${IDENTITY_FIXTURE_PASSWORD:?run backend/platform/init_env.py}
      CATALOG_WORKLOAD_SECRET: ${CATALOG_WORKLOAD_SECRET:?run backend/platform/init_env.py}
      COMMUNITY_WORKLOAD_SECRET: ${COMMUNITY_WORKLOAD_SECRET:?run backend/platform/init_env.py}
      TRIP_WORKLOAD_SECRET: ${TRIP_WORKLOAD_SECRET:?run backend/platform/init_env.py}
      INGESTION_WORKLOAD_SECRET: ${INGESTION_WORKLOAD_SECRET:?run backend/platform/init_env.py}
      INTELLIGENCE_WORKLOAD_SECRET: ${INTELLIGENCE_WORKLOAD_SECRET:?run backend/platform/init_env.py}
    volumes: [identity-objects:/app/.local, identity-signing-keys:/run/identity:ro]

  # PostGIS: the catalog database needs the postgis extension (managed DB: CREATE EXTENSION first).
  catalog:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/catalog-service}
    image: smarttravel-catalog:p02-local
    depends_on:
      <<: *service-depends
      identity: {condition: service_healthy}
    environment:
      <<: *service-env
      PORT: '8102'
      JWT_AUDIENCE: catalog
      BROKER_USERNAME: catalog_runtime
      BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run backend/platform/init_env.py}
      CATALOG_BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run backend/platform/init_env.py}
      CATALOG_TRANSPORT_ENABLED: 'true'
      DB_URL: ${CATALOG_DB_URL:?set CATALOG_DB_URL in .env}
      DB_USER: catalog_runtime
      DB_PASSWORD: ${CATALOG_RUNTIME_PASSWORD:?set CATALOG_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: catalog_migrator
      DB_MIGRATION_PASSWORD: ${CATALOG_MIGRATION_PASSWORD:?set CATALOG_MIGRATION_PASSWORD in .env}
      CATALOG_CURSOR_KEY: ${CATALOG_CURSOR_KEY:?run backend/platform/init_env.py}
      WORKLOAD_CLIENT_ID: catalog
      WORKLOAD_CLIENT_SECRET: ${CATALOG_WORKLOAD_SECRET:?run backend/platform/init_env.py}
    volumes: [catalog-objects:/app/.local]

  community:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/community-service}
    image: smarttravel-community:p02-local
    depends_on:
      <<: *service-depends
      community-migrate: {condition: service_completed_successfully}
      identity: {condition: service_healthy}
    environment:
      <<: *service-env
      PORT: '8103'
      JWT_AUDIENCE: community
      BROKER_USERNAME: community_runtime
      BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      COMMUNITY_BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run backend/platform/init_env.py}
      COMMUNITY_TRANSPORT_ENABLED: 'true'
      MONGODB_URI: ${COMMUNITY_MONGODB_URI:?set COMMUNITY_MONGODB_URI in .env}
      WORKLOAD_CLIENT_ID: community
      WORKLOAD_CLIENT_SECRET: ${COMMUNITY_WORKLOAD_SECRET:?run backend/platform/init_env.py}
    volumes: [community-objects:/app/.local]

  trip:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/trip-service}
    image: smarttravel-trip:p02-local
    depends_on:
      <<: *service-depends
      identity: {condition: service_healthy}
    environment:
      <<: *service-env
      PORT: '8104'
      JWT_AUDIENCE: trip
      BROKER_USERNAME: trip_runtime
      BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run backend/platform/init_env.py}
      TRIP_BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run backend/platform/init_env.py}
      TRIP_TRANSPORT_ENABLED: 'true'
      DB_URL: ${TRIP_DB_URL:?set TRIP_DB_URL in .env}
      DB_USER: trip_runtime
      DB_PASSWORD: ${TRIP_RUNTIME_PASSWORD:?set TRIP_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: trip_migrator
      DB_MIGRATION_PASSWORD: ${TRIP_MIGRATION_PASSWORD:?set TRIP_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: trip
      WORKLOAD_CLIENT_SECRET: ${TRIP_WORKLOAD_SECRET:?run backend/platform/init_env.py}
    volumes: [trip-objects:/app/.local]

  ingestion:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/ingestion-service}
    image: smarttravel-ingestion:p02-local
    depends_on:
      <<: *service-depends
      identity: {condition: service_healthy}
    environment:
      <<: *service-env
      PORT: '8105'
      JWT_AUDIENCE: ingestion
      BROKER_USERNAME: ingestion_runtime
      BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INGESTION_BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INGESTION_TRANSPORT_ENABLED: 'true'
      DB_URL: ${INGESTION_DB_URL:?set INGESTION_DB_URL in .env}
      DB_USER: ingestion_runtime
      DB_PASSWORD: ${INGESTION_RUNTIME_PASSWORD:?set INGESTION_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: ingestion_migrator
      DB_MIGRATION_PASSWORD: ${INGESTION_MIGRATION_PASSWORD:?set INGESTION_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: ingestion
      WORKLOAD_CLIENT_SECRET: ${INGESTION_WORKLOAD_SECRET:?run backend/platform/init_env.py}
      WORKER_ENABLED: 'true'
      # Comma-separated external source hosts the connector may fetch from.
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-none.invalid}
    volumes: [ingestion-objects:/app/.local]

  # pgvector: the intelligence database needs the vector extension (managed DB: CREATE EXTENSION first).
  intelligence:
    <<: *service
    build: {<<: *service-build, context: ./backend/services/intelligence-service}
    image: smarttravel-intelligence:p02-local
    depends_on:
      <<: *service-depends
      identity: {condition: service_healthy}
    environment:
      <<: *service-env
      PORT: '8106'
      JWT_AUDIENCE: intelligence
      BROKER_USERNAME: intelligence_runtime
      BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INTELLIGENCE_BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run backend/platform/init_env.py}
      INTELLIGENCE_TRANSPORT_ENABLED: 'true'
      DB_URL: ${INTELLIGENCE_DB_URL:?set INTELLIGENCE_DB_URL in .env}
      DB_USER: intelligence_runtime
      DB_PASSWORD: ${INTELLIGENCE_RUNTIME_PASSWORD:?set INTELLIGENCE_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: intelligence_migrator
      DB_MIGRATION_PASSWORD: ${INTELLIGENCE_MIGRATION_PASSWORD:?set INTELLIGENCE_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: intelligence
      WORKLOAD_CLIENT_SECRET: ${INTELLIGENCE_WORKLOAD_SECRET:?run backend/platform/init_env.py}
    volumes: [intelligence-objects:/app/artifacts]

  # ---- Single entry point -------------------------------------------------------------------
  gateway:
    build: {<<: *service-build, context: ./backend/platform/api-gateway}
    image: smarttravel-api-gateway:p02-local
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      community: {condition: service_healthy}
      trip: {condition: service_healthy}
      ingestion: {condition: service_healthy}
      intelligence: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: p02-local
      PORT: '8080'
      JWT_ISSUER: http://identity:8101
      JWT_JWKS_URI: http://identity:8101/.well-known/jwks.json
      GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?run backend/platform/init_env.py}
      GATEWAY_IDENTITY_EXCHANGE_URI: http://identity:8101/internal/v1/security/exchange
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:58080,http://127.0.0.1:58080}
      # AI routes stay deferred unless enabled (the integration smoke needs true).
      AI_ENABLED: ${AI_ENABLED:-false}
      GATEWAY_RESPONSE_TIMEOUT: ${GATEWAY_RESPONSE_TIMEOUT:-15s}
      IDENTITY_URL: http://identity:8101
      CATALOG_URL: http://catalog:8102
      COMMUNITY_URL: http://community:8103
      TRIP_URL: http://trip:8104
      INGESTION_URL: http://ingestion:8105
      INTELLIGENCE_URL: http://intelligence:8106
    # [ip:]port of the public entry point; loopback unless a reverse proxy/TLS sits in front.
    ports: ['${GATEWAY_PUBLISH:-127.0.0.1:58080}:8080']
    healthcheck:
      test: [CMD-SHELL, 'busybox wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    restart: unless-stopped

volumes:
  rabbitmq-data:
  identity-objects:
  catalog-objects:
  community-objects:
  trip-objects:
  ingestion-objects:
  intelligence-objects:
  identity-signing-keys:
