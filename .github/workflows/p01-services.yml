name: P01 independent services
on:
  pull_request:
    paths: ['backend/services/**', 'backend/infra/**', 'backend/platform/**', 'backend/contracts/**', 'frontend/**', 'backend/.gitattributes', 'backend/.mvn/**', 'backend/mvnw*', '.github/workflows/p01-services.yml']
  push:
    branches: [main]
    paths: ['backend/services/**', 'backend/infra/**', 'backend/platform/**', 'backend/contracts/**', 'frontend/**', 'backend/.gitattributes', '.github/workflows/p01-services.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    env:
      P01_CATALOG_DB_PORT: '0'
      # Only Identity uses host broker probes; other services use the Docker network.
      P01_BROKER_AMQP_PORT: ${{ matrix.service == 'identity' && '55672' || '0' }}
      P01_BROKER_MANAGEMENT_PORT: ${{ matrix.service == 'identity' && '55673' || '0' }}
    # MongoDB 8 rejects kernels >=6.19 (SERVER-121912); Ubuntu22.04 uses6.8.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # AI suites stay deferred until the user resumes that scope.
        service: [identity, catalog, community, trip, ingestion]
    steps:
      - name: Record database host kernel
        run: uname -sr
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract and signed local JWKS dependencies
        run: python -m pip install -r backend/platform/requirements-validation.txt
      - name: Build one service and run unit/security tests
        run: bash backend/mvnw -B -f backend/services/pom.xml -pl ${{ matrix.service }}-service -am clean verify
      - name: Domain, provider and broker fault tests on disposable real dependencies
        run: python backend/services/${{ matrix.service }}-service/test-local.py --transport
      - name: Start only this service's real database
        run: python backend/infra/p01.py up --service ${{ matrix.service }}
      - name: Real migration, JWT and runtime probes (repeat validates checksums)
        run: |
          python backend/infra/p01.py smoke --service ${{ matrix.service }}
          python backend/infra/p01.py smoke --service ${{ matrix.service }}
          python backend/infra/p01.py verify --service ${{ matrix.service }}
      - name: Build immutable revision image and rollback artifact
        run: |
          docker build -t smarttravel-${{ matrix.service }}:${{ github.sha }} backend/services/${{ matrix.service }}-service
          docker save smarttravel-${{ matrix.service }}:${{ github.sha }} | gzip > image-${{ matrix.service }}-${{ github.sha }}.tar.gz
      - name: Identity image, real mail and frozen provider schemas
        if: matrix.service == 'identity'
        run: python backend/services/identity-service/check-local.py --transport --image smarttravel-identity:${{ github.sha }}
      - name: Independent non-root image and frozen provider smoke
        if: matrix.service != 'identity'
        run: python backend/services/${{ matrix.service }}-service/check-local.py --image smarttravel-${{ matrix.service }}:${{ github.sha }}
      - name: Archive test evidence and revision image (no credentials)
        uses: actions/upload-artifact@v4
        # Diagnostic archive is best-effort when GitHub storage quota is exhausted.
        # Mandatory build/test steps above still fail normally; release gates require retained evidence.
        continue-on-error: true
        with:
          name: ${{ matrix.service }}-${{ github.sha }}
          path: |
            backend/services/${{ matrix.service }}-service/target/surefire-reports/
            image-${{ matrix.service }}-${{ github.sha }}.tar.gz
          retention-days: 7
      - name: Stop local dependencies, retain volumes
        if: always()
        run: python backend/infra/p01.py down
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/platform/requirements-validation.txt
      - name: Shared contract change checks all six provider/consumer fixtures
        run: |
          python backend/platform/test_service_layout.py
          python backend/infra/test_p01_ports.py
          python backend/platform/test_catalog_readiness.py
          python backend/platform/test_identity_runner.py
          python backend/platform/test_identity_image.py
          python backend/platform/validate_contracts.py
          python backend/platform/test_contract_checksums.py
          python backend/platform/test_contract_policy.py
          python backend/platform/test_contract_stubs.py
          python backend/platform/test_event_harness.py
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gateway live signed-JWKS routing, security, CORS and request limits
        run: bash backend/mvnw -B -f backend/platform/api-gateway/pom.xml clean verify
      - name: Frontend client behavior, auth concurrency and type/build checks
        working-directory: frontend
        run: |
          npm ci
          npm run test:contracts
          npm run build
          npm audit --audit-level=high
      - name: Build Gateway revision image
        run: docker build -t smarttravel-api-gateway:${{ github.sha }} backend/platform/api-gateway
      - uses: actions/upload-artifact@v4
        # Keep completed test gates usable during an external artifact-storage outage.
        continue-on-error: true
        with:
          name: platform-${{ github.sha }}
          path: backend/platform/api-gateway/target/surefire-reports/
