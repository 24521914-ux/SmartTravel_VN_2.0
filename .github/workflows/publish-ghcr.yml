name: Publish SmartTravel Images to GHCR (Azure B1)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (e.g. azure-b1)
        required: true
        default: azure-b1

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: backend/platform/api-gateway
          - name: identity
            context: backend/services/identity-service
          - name: catalog
            context: backend/services/catalog-service
          - name: community
            context: backend/services/community-service
          - name: trip
            context: backend/services/trip-service
          - name: ingestion
            context: backend/services/ingestion-service
          - name: intelligence
            context: backend/services/intelligence-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: meta
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: backend=./backend
          target: source
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/smarttravel-${{ matrix.name }}:${{ inputs.tag || 'azure-b1' }}
            ghcr.io/${{ steps.meta.outputs.owner }}/smarttravel-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
