name: P02 real service integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/p02-integration.yml']
permissions:
  contents: read
jobs:
  connected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install verification dependencies
        run: |
          python -m pip install -r backend/platform/requirements-validation.txt PyYAML
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Validate frozen contracts and build final source
        run: |
          python backend/platform/validate_contracts.py
          bash backend/mvnw -B -f backend/services/pom.xml clean verify
          bash backend/mvnw -B -f backend/platform/api-gateway/pom.xml clean verify
          npm --prefix frontend run test:contracts
          npm --prefix frontend run build
      - name: Build and connect all real service images
        run: |
          python backend/infra/p02.py build
          python backend/infra/p02.py up
      - name: Real gateway domain transport and deletion flows
        run: |
          python backend/infra/p02.py smoke
          python backend/infra/p02_faults.py
          python backend/infra/p02_privacy_test.py
          python backend/infra/p02_transport_test.py
          python backend/infra/p02_import_ack_test.py
          npm --prefix frontend run test:gateway
      - name: Actual browser UI smoke
        run: |
          npm --prefix frontend run dev > /tmp/smarttravel-p02-vite.log 2>&1 &
          npm --prefix frontend run test:browser
      - name: Record exact images and runtime alerts
        run: |
          python backend/infra/p02.py manifest
          python backend/infra/p02.py monitor
      - name: Archive sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-connected-${{ github.sha }}
          path: |
            backend/infra/.local/p02/smoke-report.json
            backend/infra/.local/p02/fault-report.json
            backend/infra/.local/p02/privacy-report.json
            backend/infra/.local/p02/transport-report.json
            backend/infra/.local/p02/import-ack-report.json
            backend/infra/.local/p02/manifest.json
            backend/infra/.local/p02/monitor.json
            backend/infra/.local/p02/dashboard.html
            backend/infra/.local/p02/frontend-browser/
          retention-days: 7
      - name: Stop only owned P02 environment
        if: always()
        run: python backend/infra/p02.py down
