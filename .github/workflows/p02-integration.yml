name: P02 real service integration
on:
  workflow_dispatch:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'docker-compose*.yml', '.env.example', '.env.local.example', '.github/workflows/p02-integration.yml']
permissions:
  contents: read
jobs:
  connected:
    # MongoDB 8 rejects kernels >=6.19 (SERVER-121912); Ubuntu22.04 uses6.8.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    # CI must never use the shared cloud databases or credentials.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml
      COMPOSE_ENV_FILES: .env.local
      P02_ENV_FILE: .env.local
    steps:
      - name: Record database host kernel
        run: uname -sr
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install verification dependencies
        run: |
          python -m pip install -r backend/platform/requirements-validation.txt PyYAML
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
      - name: Validate frozen contracts and build final source
        run: |
          python backend/platform/validate_contracts.py
          bash backend/mvnw -B -f backend/services/pom.xml -pl identity-service,catalog-service,community-service,trip-service,ingestion-service -am clean verify
          # Keep the existing container for deletion ACKs; do not run AI suites.
          bash backend/mvnw -B -f backend/services/pom.xml -pl intelligence-service -am -DskipTests package
          bash backend/mvnw -B -f backend/platform/api-gateway/pom.xml clean verify
          npm --prefix frontend run test:contracts
          npm --prefix frontend run build
      - name: Build and connect all real service images
        # Images package the JARs verified above (runtime target); the stack is docker-compose.yml
        # plus explicitly selected docker-compose.local.yml (isolated databases).
        env:
          SERVICE_BUILD_TARGET: runtime
        run: |
          python backend/platform/init_env.py --mode local
          # The backend integration suites exercise the deferred AI routes too (F-36).
          sed -i 's/^AI_ENABLED=.*/AI_ENABLED=true/' .env.local
          docker compose up -d --build --wait --wait-timeout 600
      - name: Real gateway domain transport and deletion flows
        run: |
          python backend/infra/p03_nonai_e2e.py --release-id p03-non-ai-${{ github.sha }}
          python backend/infra/p03_nonai_resilience.py --release-id p03-non-ai-${{ github.sha }} --allow-p02-outages
          python backend/infra/p02_import_ack_test.py
          npm --prefix frontend run test:gateway
      - name: Actual browser UI smoke
        run: |
          npm --prefix frontend run dev > /tmp/smarttravel-p02-vite.log 2>&1 &
          export P03_RELEASE_ID=p03-non-ai-${{ github.sha }}
          npm --prefix frontend run test:browser
      - name: Record exact images and runtime alerts
        run: |
          python backend/infra/p02.py manifest
          python backend/infra/p02.py monitor
      - name: Archive sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        # Diagnostic archive is best-effort when GitHub storage quota is exhausted.
        # Mandatory build/test steps above still fail normally; release gates require retained evidence.
        continue-on-error: true
        with:
          name: p02-connected-${{ github.sha }}
          path: |
            backend/infra/.local/p03/e2e-report.json
            backend/infra/.local/p03/resilience-report.json
            backend/infra/.local/p03/frontend-browser/
            backend/infra/.local/p02/import-ack-report.json
            backend/infra/.local/p02/manifest.json
            backend/infra/.local/p02/monitor.json
            backend/infra/.local/p02/dashboard.html
            backend/infra/.local/p02/frontend-browser/
          retention-days: 7
      - name: Stop only owned P02 environment
        if: always()
        run: docker compose down
