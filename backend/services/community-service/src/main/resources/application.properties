spring.application.name=community-service
server.port=${PORT:8103}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
security.jwt.jwk-set-uri=${JWT_JWKS_URI}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE:community}
logging.pattern.level=%5p [correlation=%X{correlationId}]
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=false

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,mongo
logging.structured.format.console=logstash
server.tomcat.connection-timeout=5s
spring.mvc.async.request-timeout=5s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

community.transport.enabled=${COMMUNITY_TRANSPORT_ENABLED:false}
community.transport.fixture-capture=${COMMUNITY_FIXTURE_CAPTURE:false}
spring.rabbitmq.host=${BROKER_HOST:127.0.0.1}
spring.rabbitmq.port=${BROKER_PORT:55672}
spring.rabbitmq.username=${COMMUNITY_BROKER_USER:community_runtime}
spring.rabbitmq.password=${COMMUNITY_BROKER_PASSWORD:}
spring.rabbitmq.virtual-host=${BROKER_VHOST:smarttravel}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=2s
management.health.rabbit.enabled=${COMMUNITY_TRANSPORT_ENABLED:false}
community.operator.broker-password=${COMMUNITY_BROKER_OPERATOR_PASSWORD:}
community.operator.broker-user=${COMMUNITY_BROKER_OPERATOR_USER:community_operator}

security.identity-session-uri=${IDENTITY_SESSION_URI:}
