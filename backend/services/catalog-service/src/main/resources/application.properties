spring.application.name=catalog-service
server.port=${PORT:8102}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
security.jwt.jwk-set-uri=${JWT_JWKS_URI}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE:catalog}
logging.pattern.level=%5p [correlation=%X{correlationId}]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.user=${DB_MIGRATION_USER:catalog_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
logging.structured.format.console=logstash
server.tomcat.connection-timeout=5s
spring.mvc.async.request-timeout=5s
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.data-source-properties.socketTimeout=5

catalog.transport.enabled=${CATALOG_TRANSPORT_ENABLED:false}
catalog.transport.fixture-capture=${CATALOG_FIXTURE_CAPTURE:false}
spring.rabbitmq.host=${BROKER_HOST:127.0.0.1}
spring.rabbitmq.port=${BROKER_PORT:55672}
spring.rabbitmq.username=${CATALOG_BROKER_USER:catalog_runtime}
spring.rabbitmq.password=${CATALOG_BROKER_PASSWORD:}
spring.rabbitmq.virtual-host=${BROKER_VHOST:smarttravel}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.connection-timeout=2s
management.health.rabbit.enabled=${CATALOG_TRANSPORT_ENABLED:false}
catalog.operator.broker-password=${CATALOG_BROKER_OPERATOR_PASSWORD:}
catalog.operator.broker-user=${CATALOG_BROKER_OPERATOR_USER:catalog_operator}

security.identity-session-uri=${IDENTITY_SESSION_URI:}
