spring.application.name=intelligence-service
server.port=${PORT:8106}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
security.jwt.jwk-set-uri=${JWT_JWKS_URI}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE:intelligence}
logging.pattern.level=%5p [correlation=%X{correlationId}]
logging.structured.format.console=logstash
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.user=${DB_MIGRATION_USER:intelligence_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

intelligence.catalog-url=${CATALOG_URL:http://127.0.0.1:8102}
intelligence.ingestion-url=${INGESTION_URL:http://127.0.0.1:8105}
intelligence.workload-token=${INTELLIGENCE_WORKLOAD_TOKEN:}
intelligence.artifact-root=${INTELLIGENCE_ARTIFACT_ROOT:.local/intelligence-artifacts}
intelligence.model-deployment-enabled=${INTELLIGENCE_MODEL_DEPLOYMENT_ENABLED:false}
intelligence.transport.enabled=${INTELLIGENCE_TRANSPORT_ENABLED:false}
spring.rabbitmq.host=${BROKER_HOST:127.0.0.1}
spring.rabbitmq.port=${BROKER_PORT:5672}
spring.rabbitmq.username=${BROKER_USERNAME:intelligence_runtime}
spring.rabbitmq.password=${BROKER_PASSWORD:}
spring.rabbitmq.virtual-host=${BROKER_VHOST:smarttravel}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.auto-startup=${INTELLIGENCE_TRANSPORT_ENABLED:false}
management.health.rabbit.enabled=${INTELLIGENCE_TRANSPORT_ENABLED:false}

intelligence.community-url=${COMMUNITY_URL:http://127.0.0.1:8103}
intelligence.identity-url=${IDENTITY_URL:http://127.0.0.1:8101}

security.identity-session-uri=${IDENTITY_SESSION_URI:}

intelligence.catalog-token=${INTELLIGENCE_CATALOG_TOKEN:}
intelligence.ingestion-token=${INTELLIGENCE_INGESTION_TOKEN:}
intelligence.community-token=${INTELLIGENCE_COMMUNITY_TOKEN:}
intelligence.identity-token=${INTELLIGENCE_IDENTITY_TOKEN:}

intelligence.trip-url=${TRIP_URL:http://127.0.0.1:8104}
intelligence.trip-token=${INTELLIGENCE_TRIP_TOKEN:}
# Client-credentials token from Identity; a static token property above still takes precedence.
workload.token-uri=${WORKLOAD_TOKEN_URI:}
workload.client-id=${WORKLOAD_CLIENT_ID:intelligence}
workload.client-secret=${WORKLOAD_CLIENT_SECRET:}
# Seconds to reuse a positive Identity session answer (0 = check every request, F-33).
security.identity-session-cache-seconds=${IDENTITY_SESSION_CACHE_SECONDS:0}
