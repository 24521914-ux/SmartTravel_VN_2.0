spring.application.name=ingestion-service
server.port=${PORT:8105}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
security.jwt.jwk-set-uri=${JWT_JWKS_URI}
security.jwt.issuer=${JWT_ISSUER}
security.jwt.audience=${JWT_AUDIENCE:ingestion}
logging.pattern.level=%5p [correlation=%X{correlationId}]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.user=${DB_MIGRATION_USER:ingestion_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true

ingestion.transport.enabled=${TRANSPORT_ENABLED:false}
spring.rabbitmq.host=${BROKER_HOST:127.0.0.1}
spring.rabbitmq.port=${BROKER_PORT:5672}
spring.rabbitmq.virtual-host=${BROKER_VHOST:smarttravel}
spring.rabbitmq.username=${BROKER_USERNAME:ingestion_runtime}
spring.rabbitmq.password=${BROKER_PASSWORD:}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
logging.structured.format.console=logstash
server.tomcat.connection-timeout=5s
server.tomcat.max-http-form-post-size=262144
ingestion.catalog.base-url=${CATALOG_BASE_URL:http://127.0.0.1:8302}
ingestion.catalog.token=${CATALOG_TOKEN:}
ingestion.fixtures.enabled=${FIXTURES_ENABLED:false}
ingestion.connector.allowed-hosts=${CONNECTOR_ALLOWED_HOSTS:127.0.0.1,localhost}
ingestion.worker.enabled=${WORKER_ENABLED:false}

management.health.rabbit.enabled=${ingestion.transport.enabled}

security.identity-session-uri=${IDENTITY_SESSION_URI:}
