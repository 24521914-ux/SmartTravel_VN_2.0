spring.application.name=identity-service
server.port=${PORT:8101}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# AMQP dependency is prepared for P01 transport; do not require a broker before that worker exists.
management.health.rabbit.enabled=${IDENTITY_TRANSPORT_ENABLED:false}
security.jwt.jwk-set-uri=${JWT_JWKS_URI:http://127.0.0.1:${server.port}/.well-known/jwks.json}
security.jwt.issuer=${JWT_ISSUER:http://localhost:8101}
security.jwt.audience=${JWT_AUDIENCE:identity}
logging.pattern.level=%5p [correlation=%X{correlationId}]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=${DB_MIGRATION_ENABLED:true}
spring.flyway.user=${DB_MIGRATION_USER:identity_migrator}
spring.flyway.password=${DB_MIGRATION_PASSWORD:}
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true
# Public Catalog HTTP validation; no fallback fixture or cross-service database access.
identity.catalog.base-url=${CATALOG_BASE_URL:}
identity.fixtures.enabled=${IDENTITY_FIXTURES_ENABLED:false}
identity.fixtures.password=${IDENTITY_FIXTURE_PASSWORD:}
identity.keys.file=${IDENTITY_KEYS_FILE:}
identity.keys.active-kid=${IDENTITY_ACTIVE_KID:}
identity.mail.encryption-key=${IDENTITY_MAIL_KEY:}
identity.mail.from=${IDENTITY_MAIL_FROM:no-reply@smarttravel.invalid}
spring.mail.host=${MAIL_HOST:127.0.0.1}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_TLS_REQUIRED:false}
