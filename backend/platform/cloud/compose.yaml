# Cloud-managed databases: applications, Gateway and RabbitMQ in Docker; PostgreSQL on Neon,
# MongoDB on Atlas. No local database, Mongo bootstrap or mail sandbox container.
#
#   python backend/platform/cloud/manage.py init   # creates .env, generates internal secrets only
#   (fill the NEON_* and ATLAS_* values in backend/platform/cloud/.env)
#   python backend/platform/cloud/manage.py up     # validate, preflight DBs, build, start, wait
#
# Only the Gateway publishes a port (loopback by default; put a TLS terminator in front of it).
# Services run the p02-local profile: service-to-service traffic is plain HTTP on the private
# Docker network, which the production profiles reject. This is a dev/staging topology, not
# a production deployment.
name: smarttravel-cloud

x-service-build: &service-build
  target: source
  additional_contexts:
    backend: ../..

x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: p02-local
  JWT_ISSUER: http://identity:8101
  JWT_JWKS_URI: http://identity:8101/.well-known/jwks.json
  BROKER_HOST: rabbitmq
  BROKER_PORT: '5672'
  BROKER_VHOST: smarttravel
  IDENTITY_SESSION_URI: http://identity:8101/internal/v1/security/session
  IDENTITY_SESSION_CACHE_SECONDS: ${IDENTITY_SESSION_CACHE_SECONDS:-15}
  GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?run manage.py init}
  CATALOG_BASE_URL: http://catalog:8102
  CATALOG_URL: http://catalog:8102
  INGESTION_URL: http://ingestion:8105
  IDENTITY_URL: http://identity:8101
  COMMUNITY_URL: http://community:8103
  TRIP_URL: http://trip:8104
  TRANSPORT_ENABLED: 'true'
  WORKLOAD_TOKEN_URI: http://identity:8101/internal/v1/security/workload-token
  SPRING_APPLICATION_JSON: >-
    {"catalog.base-url":"http://catalog:8102","ingestion.base-url":"http://ingestion:8105",
    "intelligence.community-url":"http://community:8103","intelligence.identity-url":"http://identity:8101",
    "intelligence.trip-url":"http://trip:8104","catalog.cursor-key":"${CATALOG_CURSOR_KEY:?run manage.py init}"}

# Application services: no published ports, reachable only through the Gateway.
x-service: &service
  restart: unless-stopped
  networks: [backend]
  depends_on: &broker-ready
    rabbit-init: {condition: service_completed_successfully}
  healthcheck: &ready
    test: [CMD-SHELL, 'curl -fsS "http://127.0.0.1:$$PORT/actuator/health/readiness" >/dev/null']
    interval: 5s
    timeout: 3s
    retries: 60
    # Neon computes may need time to wake up on the first connection.
    start_period: 60s

services:
  # ---- Messaging (private network only) ------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
      RABBITMQ_CTL_ERL_ARGS: +S 2:2
      RABBITMQ_DEFAULT_USER: platform_admin
      RABBITMQ_DEFAULT_PASS: ${BROKER_ADMIN_PASSWORD:?run manage.py init}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, su-exec rabbitmq rabbitmq-diagnostics -q check_running && su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  # Vhost, per-service users/permissions, exchanges and bindings from contracts/registry.json.
  rabbit-init:
    build: {context: ../init}
    image: smarttravel-platform-tools:local
    depends_on: {rabbitmq: {condition: service_healthy}}
    networks: [backend]
    environment:
      BROKER_API_URL: http://rabbitmq:15672
      BROKER_ADMIN_PASSWORD: ${BROKER_ADMIN_PASSWORD:?run manage.py init}
      IDENTITY_BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run manage.py init}
      CATALOG_BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run manage.py init}
      COMMUNITY_BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run manage.py init}
      TRIP_BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run manage.py init}
      INGESTION_BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run manage.py init}
      INTELLIGENCE_BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run manage.py init}
      CATALOG_BROKER_OPERATOR_PASSWORD: ${CATALOG_BROKER_OPERATOR_PASSWORD:?run manage.py init}
    volumes: [../../contracts/registry.json:/contracts/registry.json:ro]

  # Identity RS256 signing key in a private volume; an existing key set is kept, never replaced.
  key-init:
    build: {context: ../init}
    image: smarttravel-platform-tools:local
    user: '0:0'
    command: [python, identity_keys.py]
    network_mode: none
    volumes: [identity-signing-keys:/keys]

  # Community schema revisions on Atlas (collections, validators, indexes, checksums). Users,
  # roles and the replica set are managed in Atlas; the migrator authenticates through the URI.
  community-migrate:
    image: mongo:8.0
    networks: [backend]
    environment:
      ATLAS_MONGODB_MIGRATION_URI: ${ATLAS_MONGODB_MIGRATION_URI:?Set ATLAS_MONGODB_MIGRATION_URI in .env}
      COMMUNITY_MIGRATION_URI_AUTH: 'true'
    entrypoint: [bash, -ec]
    command: ['mongosh "$$ATLAS_MONGODB_MIGRATION_URI" --quiet /p01/migrate.js']
    volumes:
      - ../../infra/mongo/migrate.js:/p01/migrate.js:ro
      - ../../services/community-service/src/main/resources/db/migration:/migrations:ro

  # ---- Application services (Neon / Atlas) ---------------------------------------------------
  identity:
    <<: *service
    build: {<<: *service-build, context: ../../services/identity-service}
    image: smarttravel-identity:cloud
    depends_on:
      <<: *broker-ready
      key-init: {condition: service_completed_successfully}
    environment:
      <<: *service-env
      PORT: '8101'
      JWT_AUDIENCE: identity
      BROKER_USERNAME: identity_runtime
      BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run manage.py init}
      IDENTITY_BROKER_PASSWORD: ${IDENTITY_BROKER_PASSWORD:?run manage.py init}
      IDENTITY_TRANSPORT_ENABLED: 'true'
      DB_URL: ${NEON_IDENTITY_DB_URL:?Set NEON_IDENTITY_DB_URL in .env}
      DB_USER: identity_runtime
      DB_PASSWORD: ${NEON_IDENTITY_RUNTIME_PASSWORD:?Set NEON_IDENTITY_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: identity_migrator
      DB_MIGRATION_PASSWORD: ${NEON_IDENTITY_MIGRATION_PASSWORD:?Set NEON_IDENTITY_MIGRATION_PASSWORD in .env}
      IDENTITY_KEYS_FILE: /run/identity/keys.json
      IDENTITY_ACTIVE_KID: p02-identity-1
      IDENTITY_MAIL_KEY: ${IDENTITY_MAIL_KEY:?run manage.py init}
      # External SMTP provider; notification e-mail stays off until one is configured.
      IDENTITY_NOTIFICATION_EMAIL_ENABLED: ${IDENTITY_NOTIFICATION_EMAIL_ENABLED:-false}
      IDENTITY_MAIL_FROM: ${IDENTITY_MAIL_FROM:-no-reply@smarttravel.invalid}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-true}
      MAIL_TLS_REQUIRED: ${MAIL_TLS_REQUIRED:-true}
      IDENTITY_FIXTURES_ENABLED: ${IDENTITY_FIXTURES_ENABLED:-false}
      IDENTITY_FIXTURE_PASSWORD: ${IDENTITY_FIXTURE_PASSWORD:?run manage.py init}
      CATALOG_WORKLOAD_SECRET: ${CATALOG_WORKLOAD_SECRET:?run manage.py init}
      COMMUNITY_WORKLOAD_SECRET: ${COMMUNITY_WORKLOAD_SECRET:?run manage.py init}
      TRIP_WORKLOAD_SECRET: ${TRIP_WORKLOAD_SECRET:?run manage.py init}
      INGESTION_WORKLOAD_SECRET: ${INGESTION_WORKLOAD_SECRET:?run manage.py init}
      INTELLIGENCE_WORKLOAD_SECRET: ${INTELLIGENCE_WORKLOAD_SECRET:?run manage.py init}
    volumes: [identity-objects:/app/.local, identity-signing-keys:/run/identity:ro]

  # Uses PostGIS: run CREATE EXTENSION postgis in the Neon catalog_db first (see README).
  catalog:
    <<: *service
    build: {<<: *service-build, context: ../../services/catalog-service}
    image: smarttravel-catalog:cloud
    environment:
      <<: *service-env
      PORT: '8102'
      JWT_AUDIENCE: catalog
      BROKER_USERNAME: catalog_runtime
      BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run manage.py init}
      CATALOG_BROKER_PASSWORD: ${CATALOG_BROKER_PASSWORD:?run manage.py init}
      CATALOG_TRANSPORT_ENABLED: 'true'
      DB_URL: ${NEON_CATALOG_DB_URL:?Set NEON_CATALOG_DB_URL in .env}
      DB_USER: catalog_runtime
      DB_PASSWORD: ${NEON_CATALOG_RUNTIME_PASSWORD:?Set NEON_CATALOG_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: catalog_migrator
      DB_MIGRATION_PASSWORD: ${NEON_CATALOG_MIGRATION_PASSWORD:?Set NEON_CATALOG_MIGRATION_PASSWORD in .env}
      CATALOG_CURSOR_KEY: ${CATALOG_CURSOR_KEY:?run manage.py init}
      WORKLOAD_CLIENT_ID: catalog
      WORKLOAD_CLIENT_SECRET: ${CATALOG_WORKLOAD_SECRET:?run manage.py init}
    volumes: [catalog-objects:/app/.local]

  community:
    <<: *service
    build: {<<: *service-build, context: ../../services/community-service}
    image: smarttravel-community:cloud
    depends_on:
      <<: *broker-ready
      community-migrate: {condition: service_completed_successfully}
    environment:
      <<: *service-env
      PORT: '8103'
      JWT_AUDIENCE: community
      BROKER_USERNAME: community_runtime
      BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run manage.py init}
      COMMUNITY_BROKER_PASSWORD: ${COMMUNITY_BROKER_PASSWORD:?run manage.py init}
      COMMUNITY_TRANSPORT_ENABLED: 'true'
      MONGODB_URI: ${ATLAS_MONGODB_URI:?Set ATLAS_MONGODB_URI in .env}
      WORKLOAD_CLIENT_ID: community
      WORKLOAD_CLIENT_SECRET: ${COMMUNITY_WORKLOAD_SECRET:?run manage.py init}
    volumes: [community-objects:/app/.local]

  trip:
    <<: *service
    build: {<<: *service-build, context: ../../services/trip-service}
    image: smarttravel-trip:cloud
    environment:
      <<: *service-env
      PORT: '8104'
      JWT_AUDIENCE: trip
      BROKER_USERNAME: trip_runtime
      BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run manage.py init}
      TRIP_BROKER_PASSWORD: ${TRIP_BROKER_PASSWORD:?run manage.py init}
      TRIP_TRANSPORT_ENABLED: 'true'
      DB_URL: ${NEON_TRIP_DB_URL:?Set NEON_TRIP_DB_URL in .env}
      DB_USER: trip_runtime
      DB_PASSWORD: ${NEON_TRIP_RUNTIME_PASSWORD:?Set NEON_TRIP_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: trip_migrator
      DB_MIGRATION_PASSWORD: ${NEON_TRIP_MIGRATION_PASSWORD:?Set NEON_TRIP_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: trip
      WORKLOAD_CLIENT_SECRET: ${TRIP_WORKLOAD_SECRET:?run manage.py init}
    volumes: [trip-objects:/app/.local]

  ingestion:
    <<: *service
    build: {<<: *service-build, context: ../../services/ingestion-service}
    image: smarttravel-ingestion:cloud
    environment:
      <<: *service-env
      PORT: '8105'
      JWT_AUDIENCE: ingestion
      BROKER_USERNAME: ingestion_runtime
      BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run manage.py init}
      INGESTION_BROKER_PASSWORD: ${INGESTION_BROKER_PASSWORD:?run manage.py init}
      INGESTION_TRANSPORT_ENABLED: 'true'
      DB_URL: ${NEON_INGESTION_DB_URL:?Set NEON_INGESTION_DB_URL in .env}
      DB_USER: ingestion_runtime
      DB_PASSWORD: ${NEON_INGESTION_RUNTIME_PASSWORD:?Set NEON_INGESTION_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: ingestion_migrator
      DB_MIGRATION_PASSWORD: ${NEON_INGESTION_MIGRATION_PASSWORD:?Set NEON_INGESTION_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: ingestion
      WORKLOAD_CLIENT_SECRET: ${INGESTION_WORKLOAD_SECRET:?run manage.py init}
      WORKER_ENABLED: 'true'
      # Comma-separated external source hosts the connector may fetch from.
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-none.invalid}
    volumes: [ingestion-objects:/app/.local]

  # Uses pgvector: run CREATE EXTENSION vector in the Neon intelligence_db first (see README).
  intelligence:
    <<: *service
    build: {<<: *service-build, context: ../../services/intelligence-service}
    image: smarttravel-intelligence:cloud
    environment:
      <<: *service-env
      PORT: '8106'
      JWT_AUDIENCE: intelligence
      BROKER_USERNAME: intelligence_runtime
      BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run manage.py init}
      INTELLIGENCE_BROKER_PASSWORD: ${INTELLIGENCE_BROKER_PASSWORD:?run manage.py init}
      INTELLIGENCE_TRANSPORT_ENABLED: 'true'
      DB_URL: ${NEON_INTELLIGENCE_DB_URL:?Set NEON_INTELLIGENCE_DB_URL in .env}
      DB_USER: intelligence_runtime
      DB_PASSWORD: ${NEON_INTELLIGENCE_RUNTIME_PASSWORD:?Set NEON_INTELLIGENCE_RUNTIME_PASSWORD in .env}
      DB_MIGRATION_USER: intelligence_migrator
      DB_MIGRATION_PASSWORD: ${NEON_INTELLIGENCE_MIGRATION_PASSWORD:?Set NEON_INTELLIGENCE_MIGRATION_PASSWORD in .env}
      WORKLOAD_CLIENT_ID: intelligence
      WORKLOAD_CLIENT_SECRET: ${INTELLIGENCE_WORKLOAD_SECRET:?run manage.py init}
    volumes: [intelligence-objects:/app/artifacts]

  # ---- Single entry point --------------------------------------------------------------------
  gateway:
    build: {<<: *service-build, context: ../api-gateway}
    image: smarttravel-api-gateway:cloud
    depends_on:
      identity: {condition: service_healthy}
      catalog: {condition: service_healthy}
      community: {condition: service_healthy}
      trip: {condition: service_healthy}
      ingestion: {condition: service_healthy}
      intelligence: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: p02-local
      PORT: '8080'
      JWT_ISSUER: http://identity:8101
      JWT_JWKS_URI: http://identity:8101/.well-known/jwks.json
      GATEWAY_EXCHANGE_SECRET: ${GATEWAY_EXCHANGE_SECRET:?run manage.py init}
      GATEWAY_IDENTITY_EXCHANGE_URI: http://identity:8101/internal/v1/security/exchange
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_ENABLED: ${AI_ENABLED:-false}
      IDENTITY_URL: http://identity:8101
      CATALOG_URL: http://catalog:8102
      COMMUNITY_URL: http://community:8103
      TRIP_URL: http://trip:8104
      INGESTION_URL: http://ingestion:8105
      INTELLIGENCE_URL: http://intelligence:8106
    # host[:ip]:port of the public entry point; loopback unless a reverse proxy/TLS sits in front.
    ports: ['${GATEWAY_PUBLISH:-127.0.0.1:58080}:8080']
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'busybox wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    restart: unless-stopped

  # ---- Tools (profile: tools) ----------------------------------------------------------------
  # Read-only TLS/connectivity/extension preflight against Neon and Atlas.
  db-check:
    build:
      context: ..
      dockerfile: cloud/Dockerfile.tools
    image: smarttravel-cloud-tools:dev
    profiles: [tools]
    networks: [backend]
    environment:
      IDENTITY_DB_URL: ${NEON_IDENTITY_DB_URL:?Set NEON_IDENTITY_DB_URL in .env}
      IDENTITY_DB_USER: identity_runtime
      IDENTITY_DB_PASSWORD: ${NEON_IDENTITY_RUNTIME_PASSWORD:?Set NEON_IDENTITY_RUNTIME_PASSWORD in .env}
      CATALOG_DB_URL: ${NEON_CATALOG_DB_URL:?Set NEON_CATALOG_DB_URL in .env}
      CATALOG_DB_USER: catalog_runtime
      CATALOG_DB_PASSWORD: ${NEON_CATALOG_RUNTIME_PASSWORD:?Set NEON_CATALOG_RUNTIME_PASSWORD in .env}
      TRIP_DB_URL: ${NEON_TRIP_DB_URL:?Set NEON_TRIP_DB_URL in .env}
      TRIP_DB_USER: trip_runtime
      TRIP_DB_PASSWORD: ${NEON_TRIP_RUNTIME_PASSWORD:?Set NEON_TRIP_RUNTIME_PASSWORD in .env}
      INGESTION_DB_URL: ${NEON_INGESTION_DB_URL:?Set NEON_INGESTION_DB_URL in .env}
      INGESTION_DB_USER: ingestion_runtime
      INGESTION_DB_PASSWORD: ${NEON_INGESTION_RUNTIME_PASSWORD:?Set NEON_INGESTION_RUNTIME_PASSWORD in .env}
      INTELLIGENCE_DB_URL: ${NEON_INTELLIGENCE_DB_URL:?Set NEON_INTELLIGENCE_DB_URL in .env}
      INTELLIGENCE_DB_USER: intelligence_runtime
      INTELLIGENCE_DB_PASSWORD: ${NEON_INTELLIGENCE_RUNTIME_PASSWORD:?Set NEON_INTELLIGENCE_RUNTIME_PASSWORD in .env}
      MONGODB_URI: ${ATLAS_MONGODB_URI:?Set ATLAS_MONGODB_URI in .env}

networks:
  backend:

volumes:
  rabbitmq-data:
  identity-signing-keys:
  identity-objects:
  catalog-objects:
  community-objects:
  trip-objects:
  ingestion-objects:
  intelligence-objects:
