server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  http:
    codecs:
      max-in-memory-size: 1MB
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000
            response-timeout: 2s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.0}
security:
  jwt:
    issuer: ${JWT_ISSUER:local-test}
    audience: ${JWT_AUDIENCE:identity,catalog,community,trip,ingestion,intelligence}
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
smarttravel:
  gateway:
    response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:2s}
    limits:
      max-body-bytes: ${GATEWAY_MAX_BODY_BYTES:1048576}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    services:
      identity:
        uri: ${IDENTITY_URL:http://localhost:8101}
        path-prefix: /api/identity
        audience: identity-service
      catalog:
        uri: ${CATALOG_URL:http://localhost:8102}
        path-prefix: /api/catalog
        audience: catalog-service
      community:
        uri: ${COMMUNITY_URL:http://localhost:8103}
        path-prefix: /api/community
        audience: community-service
      trip:
        uri: ${TRIP_URL:http://localhost:8104}
        path-prefix: /api/trip
        audience: trip-service
      ingestion:
        uri: ${INGESTION_URL:http://localhost:8105}
        path-prefix: /api/ingestion
        audience: ingestion-service
      intelligence:
        uri: ${INTELLIGENCE_URL:http://localhost:8106}
        path-prefix: /api/intelligence
        audience: intelligence-service
logging:
  pattern:
    level: "%5p traceId=%X{traceId:-}"
  structured:
    format:
      console: logstash
